name: Bug report / Ошибка
description: Report reproducible behavior using fictional or redacted data.
labels: [bug]
body:
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Release/commit, Node.js version, OS/browser, local demo or real instance. No secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal example, expected behavior and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Logs or screenshots with no passwords, recovery links, customer models or private database records.
