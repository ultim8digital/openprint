name: OpenPrint CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify default catalog container and guest publication persistence
        run: |
          set -euo pipefail
          trap 'docker rm -fv openprint-check >/dev/null 2>&1 || true' EXIT
          docker build -t openprint:test .
          docker run -d --name openprint-check -p 127.0.0.1:3100:3000 -e APP_URL=http://127.0.0.1:3100 openprint:test
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {randomBytes} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import {setTimeout} from 'node:timers/promises';
          const origin='http://127.0.0.1:3100';
          async function call(path,method='GET',body,key){
            const response=await fetch(origin+'/api'+path,{
              method,signal:AbortSignal.timeout(5000),
              headers:{...(body===undefined?{}:{Origin:origin,'Content-Type':'application/json'}),...(key?{'X-Catalog-Key':key}:{})},
              ...(body===undefined?{}:{body:JSON.stringify(body)}),
            });
            return {status:response.status,data:await response.json()};
          }
          async function healthy(){
            for(let n=0;n<30;n++){
              let result;
              try{result=await call('/health');}catch{}
              if(result?.status===200){assert.equal(result.data.mode,'catalog');return;}
              await setTimeout(1000);
            }
            throw new Error('Container did not become healthy');
          }
          async function publicMode(){
            const state=await call('/bootstrap');
            assert.equal(state.status,200);
            assert.equal(state.data.mode,'catalog');
            assert.equal(state.data.user,null);
            assert.equal(state.data.profile,null);
            assert.equal(state.data.demo,false);
            assert.deepEqual(state.data.demoUsers,[]);
            const registration=await call('/auth/register','POST',{});
            assert.equal(registration.status,404);
            assert.equal(registration.data.code,'NOT_FOUND');
          }
          function docker(...args){
            const result=spawnSync('docker',args,{stdio:'inherit',timeout:30000});
            if(result.error || result.status!==0)throw new Error('Container lifecycle check failed');
          }
          await healthy();
          await publicMode();
          assert.equal((await call('/directory')).data.total,0);
          // The random management key remains only in this process, never in logs or files.
          const key=randomBytes(32).toString('hex');
          const studio={name:'Synthetic CI workshop',city:'Test city',region:'',country:'',
            description:'A fictional container smoke-test listing.',technologies:['FDM'],materials:['PLA'],
            website:'https://workshop.example.test',phone:'',address:'',lat:0,lng:0};
          const created=await call('/directory/submissions','POST',{management_key:key,studio,rights_confirmed:true});
          assert.equal(created.status,201);
          const id=created.data.studio.id;
          assert.match(id,/^[a-f0-9-]{36}$/);
          async function visible(){
            const list=await call('/directory'),map=await call('/directory/map');
            assert.equal(list.status,200);
            assert.equal(list.data.total,1);
            assert.equal(list.data.members,0);
            assert.equal(list.data.entries[0].studio.id,id);
            assert.equal(map.status,200);
            assert.equal(map.data.total,1);
            assert.equal(map.data.mappable,1);
            assert.deepEqual(map.data.points,[{id,source:'catalog',name:studio.name,city:studio.city,lat:0,lng:0}]);
            const detail=await call('/directory/catalog/'+id);
            assert.equal(detail.status,200);
            assert.equal(detail.data.studio.name,studio.name);
          }
          await visible();
          docker('stop','openprint-check');
          docker('start','openprint-check');
          await healthy();
          await publicMode();
          await visible();
          const managed=await call('/directory/submissions/'+id,'GET',undefined,key);
          assert.equal(managed.status,200);
          assert.equal(managed.data.studio.id,id);
          assert.equal(managed.data.studio.version,1);
          const deleted=await call('/directory/submissions/'+id,'DELETE',{version:1},key);
          assert.equal(deleted.status,200);
          assert.equal(deleted.data.deleted,true);
          assert.equal((await call('/directory/catalog/'+id)).status,404);
          assert.equal((await call('/directory')).data.total,0);
          assert.equal((await call('/directory/map')).data.total,0);
          // Confirm that guest publication did not create hidden accounts, profiles or orders.
          docker('exec','openprint-check','node','--input-type=module','-e',
            "import {DatabaseSync} from 'node:sqlite';import {join} from 'node:path';const db=new DatabaseSync(join(process.env.DATA_DIR,'openprint.sqlite'),{readOnly:true});for(const table of ['users','profiles','sessions','jobs'])if(db.prepare('SELECT count(*) n FROM '+table).get().n!==0)throw new Error('Unexpected account or order data');db.close();");
          console.log('Default catalog: anonymous publication, restart, secret management and deletion passed; no accounts created');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cad-worker/requirements.txt
            cad-worker/requirements-test.txt
      - name: Install native CAD runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libglib2.0-0 libxrender1 libxext6 libsm6
          python -m pip install -r cad-worker/requirements-test.txt
          python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a").write("CAD_PYTHON=" + sys.executable + "\n")'
      - run: python cad-worker/worker.py --check
      - run: python -m pytest cad-worker/tests -q
      - run: npm ci --ignore-scripts
      - name: Verify AI proposal application with the real CAD kernel
        run: node --import tsx --test tests/cad-ai.test.ts
      - run: npm run build
      - run: node scripts/cad-check.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise CAD assembly and immutable handoff in Chromium
        run: npx playwright test tests/e2e/cad.spec.ts
      - name: Build optional CAD container and compile a real part
        run: |
          docker build --target cad -t openprint:cad-test .
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --entrypoint /opt/cad/bin/python openprint:cad-test /app/cad-worker/worker.py --check
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --entrypoint /opt/cad/bin/python openprint:cad-test -c '
          import json, math, pathlib, subprocess, sys
          subprocess.run([sys.executable, "/app/cad-worker/worker.py", "--input", "/app/cad-worker/examples/plate.json", "--output", "/tmp/plate"], check=True, timeout=120)
          report = json.loads(pathlib.Path("/tmp/plate/report.json").read_text())
          assert report["passed"] and report["solids"] == 1
          assert abs(report["volume_mm3"] - (60 * 40 * 6 - math.pi * 4**2 * 6)) < 0.0001
          assert pathlib.Path("/tmp/plate/model.step").stat().st_size > 0
          print("Optional container: real CAD compile and numerical volume check passed")
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cad-browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
